<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC — Sala de Vídeo</title>
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <!-- Tela de entrada -->
  <div id="lobby">
    <div class="lobby-card">
      <h1>WebRTC — Sala de Vídeo</h1>
      <p class="lobby-subtitle">Até 5 participantes por sala</p>
      <div class="lobby-form">
        <label for="roomId" class="sr-only">ID da sala</label>
        <input type="text" id="roomId" placeholder="ID da sala (ex: sala123)" autocomplete="off">
        <button type="button" id="joinBtn">Entrar na Sala</button>
      </div>
      <p class="lobby-id">Seu ID: <strong id="myId">Conectando...</strong></p>
      <!-- Mensagens de conexão e de falha de câmera aparecem aqui: precisa ser
           região viva, senão só quem enxerga fica sabendo. -->
      <div id="lobbyStatus" role="status" aria-live="polite"></div>
    </div>
  </div>

  <!-- Sala de vídeo -->
  <div id="room" class="hidden">
    <div id="palco">
      <!-- areaVideo existe só para servir de referência às container queries do
           grid: com o chat aberto o espaço do vídeo muda, e é esse espaço, não
           o da janela, que decide se os quadros ficam lado a lado ou empilhados. -->
      <div id="areaVideo">
        <div id="videosGrid" role="group" aria-label="Participantes da chamada"></div>
      </div>

      <aside id="chat" class="hidden" aria-label="Chat da chamada">
        <div class="chat-topo">
          <span>Chat da chamada</span>
          <button id="chatFecharBtn" class="chat-fechar" title="Fechar chat" aria-label="Fechar chat">✕</button>
        </div>
        <div id="chatMensagens" role="log" aria-live="polite"></div>
        <form id="chatForm" autocomplete="off">
          <input id="chatTexto" type="text" maxlength="2000" aria-label="Mensagem"
                 placeholder="Escreva uma mensagem">
          <button type="submit" title="Enviar">Enviar</button>
        </form>
      </aside>
    </div>

    <div class="room-bar">
      <span id="roomLabel" class="room-name"></span>
      <div class="room-controls" role="group" aria-label="Controles da chamada">
        <button type="button" id="muteBtn" class="ctrl-btn" title="Microfone"
                aria-label="Desligar o microfone" aria-pressed="false">
          <span aria-hidden="true">🎤</span>
        </button>
        <button type="button" id="videoBtn" class="ctrl-btn" title="Câmera"
                aria-label="Desligar a câmera" aria-pressed="false">
          <span aria-hidden="true">📹</span>
        </button>
        <button type="button" id="chatBtn" class="ctrl-btn" title="Chat"
                aria-label="Abrir chat" aria-expanded="false" aria-controls="chat">
          <span aria-hidden="true">💬</span><span id="chatBadge" class="chat-badge hidden">0</span>
        </button>
        <button type="button" id="recordBtn" class="ctrl-btn" title="Gravar"
                aria-label="Iniciar gravação" aria-pressed="false">
          <span aria-hidden="true">⏺️</span>
        </button>
      </div>
      <!-- Estado da chamada: "gravando", "participante saiu", "enviando
           gravação". Sem região viva, só chega a quem está olhando. -->
      <div id="status" role="status" aria-live="polite"></div>
    </div>
  </div>

  <!-- Fim de chamada. Ocupa o lugar do lobby quando a sala é encerrada pelo
       intérprete: quem chega aqui é o surdo, e devolver o formulário de entrada
       só o convidaria a voltar para uma sala que não existe mais. -->
  <div id="encerrada" class="hidden" role="status" aria-live="polite">
    <div class="lobby-card">
      <h1>Chamada encerrada</h1>
      <p class="lobby-subtitle" id="encerradaTexto">O intérprete encerrou o atendimento.</p>
    </div>
  </div>

  <script src="comum.js?v=12"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
